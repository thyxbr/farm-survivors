# Em todo PR para o main: só os testes (em paralelo, no GitHub), para não precisar rodar a suíte inteira
# na máquina a cada alteração. PR que só mexe em docs, .claude, tools/blender ou protótipos não roda nada.
# A cada push no main: roda os testes (unitários + gameplay + multiplayer) e, se passarem,
# publica o cliente Windows no GitHub Releases (só quando a versão do project.godot é nova;
# é de lá que o auto update do jogo baixa) e dispara o deploy do servidor no Easypanel.
# O link de deploy fica no secret EASYPANEL_DEPLOY_URL (Settings → Secrets and variables → Actions).
name: Testes e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'tools/blender/**'
      - 'prototipo_asas/**'
  workflow_dispatch:

# um deploy por vez; um push novo cancela o anterior que ainda estiver rodando
# (em PR o grupo é o do PR: um push novo no PR cancela só os testes antigos daquele PR)
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # Os testes rodam em paralelo, um job por grupo (cada um baixa o Godot do cache e importa os assets, ~30 s):
  # o tempo total é o do grupo mais lento (o smoke test do mundo) e não a soma. Os jobs seguintes têm
  # `needs: test`, que espera todos os grupos.
  # O Desafio da Horda está desligado (Game.HORDE_ENABLED): a parte horda do smoke test não roda.
  test:
    name: Testes (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: rapidos
            name: unitários, modelos e vila
          - suite: mundo
            name: smoke test do mundo
          - suite: multiplayer
            name: multiplayer
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Baixar Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Importar assets
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -q "SCRIPT ERROR" import.log; then
            echo "::error::Erro de script ao importar o projeto"
            grep -A1 "SCRIPT ERROR" import.log
            exit 1
          fi
          # o servidor usa o SQLite do addons/godot-sqlite (GDExtension): no Linux o .so tem que carregar
          if grep -qiE "Can't open dynamic library|Error loading extension|GDExtension.*(failed|error)" import.log; then
            echo "::error::A extensão godot-sqlite não carregou no Linux"
            grep -iE "dynamic library|extension" import.log
            exit 1
          fi

      # regras puras (contas, banco, economia, balanceamento...); erro de script num teste conta como falha
      - name: Testes unitários
        if: matrix.suite == 'rapidos'
        run: timeout 300 godot --headless --path . -s tests/unit/run.gd

      # o smoke test, parte do mundo (tests/smoke_test.gd, --smoke-part); a parte horda fica de fora enquanto a Horda está desligada
      - name: Teste de gameplay (smoke test, mundo)
        if: matrix.suite == 'mundo'
        run: timeout 600 godot --headless --path . res://scenes/world.tscn -- --smoketest --smoke-part=mundo

      - name: Teste do modelo do ferreiro (esqueleto e clipes)
        if: matrix.suite == 'rapidos'
        run: timeout 120 godot --headless --path . --script res://tests/blacksmith_asset_test.gd

      - name: Teste dos modelos do Bram e da Mira (esqueleto, cajado e clipes)
        if: matrix.suite == 'rapidos'
        run: timeout 120 godot --headless --path . --script res://tests/npc_asset_test.gd

      - name: Teste da marcha do cavaleiro (cabeça, quadril, pé de apoio, mão, peso)
        if: matrix.suite == 'rapidos'
        run: timeout 120 godot --headless --path . res://tests/gait_test.tscn

      # a vila no solo: bairros, Mestre Orin e quadro de recordes, Ecos, passiva, Papai Noel e os quatro
      # eventos de Natal e a tela de carregamento
      - name: Teste da vila (solo)
        if: matrix.suite == 'rapidos'
        run: timeout 300 godot --headless --path . res://scenes/world.tscn -- --vilatest

      # servidor com banco novo (arquivo temporário), API HTTP de login numa porta própria e --test
      # (ouro e Ecos de teste do net_test); os clientes criam conta via --auth-url
      - name: Teste de multiplayer (servidor + 2 clientes)
        if: matrix.suite == 'multiplayer'
        run: |
          db=$(mktemp --suffix=.db); rm -f "$db"
          godot --headless --path . -- --server --port=7790 --http-port=8790 --db="$db" --test --clock-offset=2500 > server.log 2>&1 &
          for i in $(seq 1 30); do grep -q "ouvindo em UDP" server.log && break; sleep 1; done
          timeout 180 godot --headless --path . -- --nettest=127.0.0.1:7790 --auth-url=http://127.0.0.1:8790 --peers=2 --name=Ana --horde=lead --expect-clock-offset=2500 > ana.log 2>&1 & A=$!
          timeout 180 godot --headless --path . -- --nettest=127.0.0.1:7790 --auth-url=http://127.0.0.1:8790 --peers=2 --name=Beto --horde=join --expect-clock-offset=2500 > beto.log 2>&1 & B=$!
          wait $A; RA=$?
          wait $B; RB=$?
          grep -hE "PASS|FAIL|NETTEST" ana.log beto.log
          exit $(( RA | RB ))

      - name: Logs do multiplayer
        if: failure() && matrix.suite == 'multiplayer'
        run: tail -n 60 server.log ana.log beto.log || true

  # Exporta o cliente Windows (artefato `cliente-windows`), que o job seguinte liga no Windows antes de
  # publicar. Se a versão já tem release (e o jogo não mudou), não exporta nada (skip=true) e os jobs
  # seguintes passam sem fazer nada.
  export:
    name: Exportar cliente Windows
    needs: test
    if: github.event_name != 'pull_request'   # PR só testa; boot-check, release e verify pulam junto
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # inclui a espera pela aprovação manual da assinatura
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      skip: ${{ steps.ver.outputs.skip }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico e tags, para comparar com a release já publicada

      # Se a versão já tem release, o jogo publicado precisa ser o mesmo código que vai para o servidor:
      # o servidor só confere o texto da versão, e cliente e servidor com código diferente na mesma versão
      # dessincronizam (as RPCs do Godot são identificadas pela posição). Então código do jogo mudou → versão nova.
      - name: Versão
        id: ver
        run: |
          ver=$(grep -oP 'config/version="\K[^"]+' project.godot)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.json; then
            if git rev-parse -q --verify "refs/tags/v$ver" > /dev/null; then
              changed=$(git diff --name-only "v$ver" HEAD -- . ':!*.md' ':!docs' ':!.github' ':!tests' ':!tools' ':!.claude' ':!.gitignore' ':!.gitattributes' ':!.dockerignore')
              if [ -n "$changed" ]; then
                echo "::error::A release v$ver já foi publicada, mas o código do jogo mudou desde ela. Aumente config/version no project.godot; sem isso o servidor recebe o código novo e os jogadores continuam com o antigo na mesma versão."
                echo "$changed"
                exit 1
              fi
            else
              echo "::warning::A release v$ver existe, mas a tag não foi encontrada: não deu para conferir se o código mudou."
            fi
            echo "A release v$ver já existe e o jogo não mudou: nada a publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache do Godot
        if: steps.ver.outputs.skip == 'false'
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Baixar Godot
        if: steps.ver.outputs.skip == 'false' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      # o pacote completo de templates tem ~1 GB; guardamos só o do Windows
      - name: Cache do template de export (Windows)
        if: steps.ver.outputs.skip == 'false'
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-windows

      - name: Baixar template de export
        if: steps.ver.outputs.skip == 'false' && steps.tcache.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d "$dir"
          rm /tmp/templates.tpz
          ls -la "$dir"

      - name: Exportar
        if: steps.ver.outputs.skip == 'false'
        run: |
          ~/godot/godot --headless --path . --import > /dev/null 2>&1
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/EcosDeValdoria.exe 2>&1 | tee export.log
          test -s build/EcosDeValdoria.exe || { echo "::error::O export não gerou o exe"; exit 1; }
          # o cliente é um exe único: nenhuma DLL (GDExtension) pode ir junto, o Smart App Control a bloquearia
          if ls build | grep -qiE '\.(dll|so)$'; then
            echo "::error::O export gerou bibliotecas nativas ao lado do exe (o zip só leva o exe):"
            ls -la build
            exit 1
          fi

      # Assinatura digital (SignPath Foundation): sem ela o Controle Inteligente de Aplicativos do
      # Windows 11 barra o exe. Só roda quando a variável SIGNPATH_ORGANIZATION_ID existe no repositório
      # (Settings → Secrets and variables → Actions → Variables); sem ela o exe segue sem assinatura,
      # como antes. O SignPath busca o artefato enviado abaixo (um zip com o exe na raiz), assina e
      # devolve em build-assinado/. Cada pedido precisa de aprovação manual no painel do SignPath:
      # o passo espera até 1 hora por ela.
      - name: Guardar o exe sem assinatura
        if: steps.ver.outputs.skip == 'false'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: cliente-windows-sem-assinatura
          path: build/EcosDeValdoria.exe
          if-no-files-found: error
          retention-days: 7

      - name: Assinar (SignPath)
        if: steps.ver.outputs.skip == 'false' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build-assinado

      - name: Trocar pelo exe assinado
        if: steps.ver.outputs.skip == 'false' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          test -s build-assinado/EcosDeValdoria.exe || { echo "::error::O SignPath não devolveu o exe assinado"; ls -la build-assinado || true; exit 1; }
          mv -f build-assinado/EcosDeValdoria.exe build/EcosDeValdoria.exe

      - name: Guardar o exe exportado
        if: steps.ver.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cliente-windows
          path: build/EcosDeValdoria.exe
          if-no-files-found: error
          retention-days: 7

  # Liga o exe exportado no Windows (sem tela) antes de publicar: a 0.8.0 saiu quebrada porque o exe
  # dependia de uma DLL que o zip não levava (parse error em todo script que usa o banco). Falha com
  # SCRIPT ERROR, Parse Error, qualquer linha de GDExtension ou saída diferente de 0.
  boot-check:
    name: Ligar o exe exportado (Windows)
    needs: export
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o exe exportado
        if: needs.export.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: cliente-windows
          path: build

      # com a assinatura ligada, o exe que vai para a release tem que chegar aqui com assinatura válida
      - name: Conferir a assinatura
        if: needs.export.outputs.skip == 'false' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature build/EcosDeValdoria.exe
          "Assinatura: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Host "::error::O exe não tem assinatura válida: $($sig.StatusMessage)"; exit 1 }

      - name: Ligar sem tela
        if: needs.export.outputs.skip == 'false'
        shell: bash
        run: |
          set +e
          ./build/EcosDeValdoria.exe --headless --quit-after 300 > boot.log 2>&1
          code=$?
          set -e
          cat boot.log
          if grep -qiE "SCRIPT ERROR|Parse Error|GDExtension" boot.log; then
            echo "::error::O exe exportado mostrou erro de script ou de GDExtension ao ligar"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::O exe exportado saiu com código $code"
            exit 1
          fi
          grep -q "Godot Engine" boot.log || { echo "::error::O exe não escreveu nada (não ligou?)"; exit 1; }

  # Publica a release v<versão> com o zip e o latest.json que o auto update (scripts/autoload/updater.gd)
  # lê, usando exatamente o exe que o boot-check ligou.
  release:
    name: Publicar cliente (GitHub Releases)
    needs: [export, boot-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}   # sem checkout: o gh precisa saber o repositório
    steps:
      - name: Baixar o exe exportado
        if: needs.export.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: cliente-windows
          path: build

      - name: Publicar release
        if: needs.export.outputs.skip == 'false'
        run: |
          ver="${{ needs.export.outputs.version }}"
          zip="EcosDeValdoria-v$ver-windows.zip"
          (cd build && zip -9 -q "../$zip" EcosDeValdoria.exe)
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          size=$(stat -c %s "$zip")
          url="https://github.com/${{ github.repository }}/releases/download/v$ver/$zip"
          printf '{"version": "%s", "url": "%s", "sha256": "%s", "size": %s, "exe": "EcosDeValdoria.exe"}\n' \
            "$ver" "$url" "$sha" "$size" > latest.json
          cat latest.json
          # se uma execução anterior foi cancelada no meio, a release pode existir sem os arquivos
          gh release delete "v$ver" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$ver" "$zip" latest.json --target "$GITHUB_SHA" --title "v$ver" \
            --notes "Ecos de Valdoria v$ver — commit $GITHUB_SHA. Quem já tem o jogo recebe esta versão pelo auto update ao abrir o menu."

  # o servidor só troca de versão depois do cliente novo estar publicado: assim quem for recusado
  # por versão diferente já encontra a atualização
  deploy:
    name: Deploy no Easypanel
    needs: [test, boot-check, release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Disparar deploy
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Falta o secret EASYPANEL_DEPLOY_URL no repositório"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST --max-time 30 "$DEPLOY_URL")
          echo "Easypanel respondeu HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat /tmp/resp.txt
            exit 1
          fi

  # O webhook responder 200 não garante que o servidor trocou: no Easypanel, com a porta UDP em modo host,
  # um deploy "zero downtime" deixa o container novo em Pending e o antigo continua no ar.
  # Aqui um cliente headless (--probe, sem conta) confere o servidor público até ele aceitar a versão deste
  # commit: GET https://<domínio>/health tem que responder esta versão (API HTTP atrás do proxy HTTPS do
  # Easypanel) e uma conexão ENet na porta UDP 7777 tem que conectar.
  verify:
    name: Conferir servidor publicado
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Baixar Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Importar assets
        run: ~/godot/godot --headless --path . --import > /dev/null 2>&1

      - name: Esperar o servidor aceitar esta versão
        run: |
          addr=$(grep -oP 'const DEFAULT_ADDRESS := "\K[^"]+' scripts/autoload/network.gd)
          ver=$(grep -oP 'config/version="\K[^"]+' project.godot)
          echo "Servidor: https://$addr/health e $addr:7777/udp — versão esperada: $ver"
          # o build no Easypanel (baixar Godot + importar) leva alguns minutos
          for i in $(seq 1 20); do
            if timeout 60 ~/godot/godot --headless --path . -- --nettest="$addr:7777" --probe --name=CI-deploy > probe.log 2>&1; then
              grep -hE "PASS|NETTEST|aceitou" probe.log
              exit 0
            fi
            msg=$(grep -E 'FAIL' probe.log | tr '\n' ' ')
            echo "tentativa $i: ${msg:-sem resposta}"
            sleep 30
          done
          echo "::error::O servidor público não aceitou a versão $ver depois de 20 tentativas (~15 min). Se só o HTTP falha, confira o domínio do app no Easypanel (proxy HTTPS para a porta 8080). No Easypanel o deploy pode estar travado em Pending (porta UDP em uso pelo container antigo): rode 'docker service ps <serviço>' na VPS e desligue o Zero Downtime do app."
          cat probe.log
          exit 1
