# A cada push no main: roda os testes (gameplay + multiplayer) e, se passarem,
# publica o cliente Windows no GitHub Releases (só quando a versão do project.godot é nova;
# é de lá que o auto update do jogo baixa) e dispara o deploy do servidor no Easypanel.
# O link de deploy fica no secret EASYPANEL_DEPLOY_URL (Settings → Secrets and variables → Actions).
name: Testes e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# um deploy por vez; um push novo cancela o anterior que ainda estiver rodando
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Baixar Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Importar assets
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -q "SCRIPT ERROR" import.log; then
            echo "::error::Erro de script ao importar o projeto"
            grep -A1 "SCRIPT ERROR" import.log
            exit 1
          fi

      - name: Teste de gameplay (smoke test)
        run: timeout 600 godot --headless --path . res://scenes/world.tscn -- --smoketest

      - name: Teste da Defesa da Cidade
        run: timeout 600 godot --headless --path . res://scenes/colony.tscn -- --colonytest

      - name: Teste de multiplayer (servidor + 2 clientes)
        run: |
          godot --headless --path . -- --server --port=7790 --horde-round=8 --horde-pick=5 > server.log 2>&1 &
          for i in $(seq 1 30); do grep -q "ouvindo em UDP" server.log && break; sleep 1; done
          timeout 180 godot --headless --path . -- --nettest=127.0.0.1:7790 --peers=2 --name=Ana --horde=lead --horde-pick=5 > ana.log 2>&1 & A=$!
          timeout 180 godot --headless --path . -- --nettest=127.0.0.1:7790 --peers=2 --name=Beto --horde=join --horde-pick=5 > beto.log 2>&1 & B=$!
          wait $A; RA=$?
          wait $B; RB=$?
          grep -hE "PASS|FAIL|NETTEST" ana.log beto.log
          exit $(( RA | RB ))

      - name: Logs do multiplayer
        if: failure()
        run: tail -n 60 server.log ana.log beto.log || true

  # Exporta o cliente Windows e publica a release v<versão> com o zip e o latest.json que o
  # auto update (scripts/autoload/updater.gd) lê. Se a versão já tem release, não faz nada.
  release:
    name: Publicar cliente (GitHub Releases)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico e tags, para comparar com a release já publicada

      # Se a versão já tem release, o jogo publicado precisa ser o mesmo código que vai para o servidor:
      # o servidor só confere o texto da versão, e cliente e servidor com código diferente na mesma versão
      # dessincronizam (as RPCs do Godot são identificadas pela posição). Então código do jogo mudou → versão nova.
      - name: Versão
        id: ver
        run: |
          ver=$(grep -oP 'config/version="\K[^"]+' project.godot)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.json; then
            if git rev-parse -q --verify "refs/tags/v$ver" > /dev/null; then
              changed=$(git diff --name-only "v$ver" HEAD -- . ':!*.md' ':!docs' ':!.github' ':!tests' ':!tools' ':!.gitignore' ':!.gitattributes' ':!.dockerignore')
              if [ -n "$changed" ]; then
                echo "::error::A release v$ver já foi publicada, mas o código do jogo mudou desde ela. Aumente config/version no project.godot; sem isso o servidor recebe o código novo e os jogadores continuam com o antigo na mesma versão."
                echo "$changed"
                exit 1
              fi
            else
              echo "::warning::A release v$ver existe, mas a tag não foi encontrada: não deu para conferir se o código mudou."
            fi
            echo "A release v$ver já existe e o jogo não mudou: nada a publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache do Godot
        if: steps.ver.outputs.skip == 'false'
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Baixar Godot
        if: steps.ver.outputs.skip == 'false' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      # o pacote completo de templates tem ~1 GB; guardamos só o do Windows
      - name: Cache do template de export (Windows)
        if: steps.ver.outputs.skip == 'false'
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-windows

      - name: Baixar template de export
        if: steps.ver.outputs.skip == 'false' && steps.tcache.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d "$dir"
          rm /tmp/templates.tpz
          ls -la "$dir"

      - name: Exportar
        if: steps.ver.outputs.skip == 'false'
        run: |
          ~/godot/godot --headless --path . --import > /dev/null 2>&1
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/EcosDeValdoria.exe 2>&1 | tee export.log
          test -s build/EcosDeValdoria.exe || { echo "::error::O export não gerou o exe"; exit 1; }

      - name: Publicar release
        if: steps.ver.outputs.skip == 'false'
        run: |
          ver="${{ steps.ver.outputs.version }}"
          zip="EcosDeValdoria-v$ver-windows.zip"
          (cd build && zip -9 -q "../$zip" EcosDeValdoria.exe)
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          size=$(stat -c %s "$zip")
          url="https://github.com/${{ github.repository }}/releases/download/v$ver/$zip"
          printf '{"version": "%s", "url": "%s", "sha256": "%s", "size": %s, "exe": "EcosDeValdoria.exe"}\n' \
            "$ver" "$url" "$sha" "$size" > latest.json
          cat latest.json
          # se uma execução anterior foi cancelada no meio, a release pode existir sem os arquivos
          gh release delete "v$ver" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$ver" "$zip" latest.json --target "$GITHUB_SHA" --title "v$ver" \
            --notes "Ecos de Valdoria v$ver — commit $GITHUB_SHA. Quem já tem o jogo recebe esta versão pelo auto update ao abrir o menu."

  # o servidor só troca de versão depois do cliente novo estar publicado: assim quem for recusado
  # por versão diferente já encontra a atualização
  deploy:
    name: Deploy no Easypanel
    needs: [test, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Disparar deploy
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Falta o secret EASYPANEL_DEPLOY_URL no repositório"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST --max-time 30 "$DEPLOY_URL")
          echo "Easypanel respondeu HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat /tmp/resp.txt
            exit 1
          fi

  # O webhook responder 200 não garante que o servidor trocou: no Easypanel, com a porta UDP em modo host,
  # um deploy "zero downtime" deixa o container novo em Pending e o antigo continua no ar.
  # Aqui um cliente headless entra no servidor público até ele aceitar a versão deste commit.
  verify:
    name: Conferir servidor publicado
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Baixar Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Importar assets
        run: ~/godot/godot --headless --path . --import > /dev/null 2>&1

      - name: Esperar o servidor aceitar esta versão
        run: |
          addr=$(grep -oP 'const DEFAULT_ADDRESS := "\K[^"]+' scripts/autoload/network.gd)
          ver=$(grep -oP 'config/version="\K[^"]+' project.godot)
          echo "Servidor: $addr:7777 — versão esperada: $ver"
          # o build no Easypanel (baixar Godot + importar) leva alguns minutos
          for i in $(seq 1 20); do
            if timeout 60 ~/godot/godot --headless --path . -- --nettest="$addr:7777" --probe --name=CI-deploy > probe.log 2>&1; then
              grep -hE "PASS|NETTEST|aceitou" probe.log
              exit 0
            fi
            echo "tentativa $i: $(grep -m1 -E 'FAIL' probe.log || echo 'sem resposta')"
            sleep 30
          done
          echo "::error::O servidor público não aceitou a versão $ver depois de 20 tentativas (~15 min). No Easypanel o deploy pode estar travado em Pending (porta UDP em uso pelo container antigo): rode 'docker service ps <serviço>' na VPS e desligue o Zero Downtime do app."
          cat probe.log
          exit 1
